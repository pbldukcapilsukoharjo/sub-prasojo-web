name: NextJS CI/CD

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-test:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter (Biome)
        run: bun run lint

      - name: Build NextJS application
        run: bun run build
        env:
          NODE_ENV: production

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun install --global vercel@latest

      - name: Pull Vercel Environment Information (Staging/Preview)
        if: github.base_ref == 'staging'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Information (Main/Production)
        if: github.base_ref == 'main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Staging/Preview)
        if: github.base_ref == 'staging'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Main/Production)
        if: github.base_ref == 'main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview (Staging)
        if: github.base_ref == 'staging'
        id: deploy-preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "environment=preview" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel Production (Main)
        if: github.base_ref == 'main'
        id: deploy-production
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "environment=production" >> $GITHUB_OUTPUT

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [lint-and-test, deploy-vercel]
    if: always()

    steps:
      - name: Send success notification to Telegram
        if: needs.lint-and-test.result == 'success' && needs.deploy-vercel.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ CI/CD Success!

            Repository: ${{ github.repository }}
            Target Branch: ${{ github.base_ref }}
            PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

            Author: ${{ github.actor }}
            
            Vercel Environment: ${{ github.base_ref == 'main' && 'Production' || 'Preview' }}
            Vercel URL: Check Actions output for deployment URL

            View PR: ${{ github.event.pull_request.html_url }}

      - name: Send failure notification to Telegram
        if: needs.lint-and-test.result == 'failure' || needs.deploy-vercel.result == 'failure'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ CI/CD Failed!

            Repository: ${{ github.repository }}
            Target Branch: ${{ github.base_ref }}
            PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

            Author: ${{ github.actor }}
            
            Vercel Deploy: ${{ needs.deploy-vercel.result }}

            View PR: ${{ github.event.pull_request.html_url }}
